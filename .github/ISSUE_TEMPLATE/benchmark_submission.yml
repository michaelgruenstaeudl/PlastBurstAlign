name: Benchmark submission
description: Share a PlastBench result from your machine or cluster
title: "[Benchmark]: "
labels: ["benchmark"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for sharing numbers! Results must come from
        `benchmarking/plastbench/plastbench.py run` (see the
        [PlastBench README](https://github.com/michaelgruenstaeudl/PlastBurstAlign/blob/main/benchmarking/plastbench/README.md))
        so that they are comparable. Please do not run the 1k/5k/15k tiers on a laptop.
  - type: dropdown
    id: tier
    attributes:
      label: Tier
      options:
        - smoke (N=100)
        - 1k
        - 5k
        - 15k
    validations:
      required: true
  - type: input
    id: mode
    attributes:
      label: Extraction mode
      description: The `--mode` of the run (cds, igs, int or rna).
      placeholder: igs
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: PlastBench command line
      placeholder: "python benchmarking/plastbench/plastbench.py run --input data/smoke100 --mode igs --threads 8 --out results/smoke.json"
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Report table
      description: Output of `plastbench.py report results.json` (Markdown).
      render: markdown
    validations:
      required: true
  - type: textarea
    id: results-json
    attributes:
      label: Results JSON
      description: Attach `results.json` (drag the file in) or paste it if it is short. It contains no host or user names.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Machine and environment
      description: >-
        CPU model and core count, RAM, storage type (local NVMe / network file
        system / tmpfs), scheduler (Slurm or none), and whether other jobs were
        running. Paste `plastburstalign --doctor` if you can.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PlastBurstAlign version / commit
      placeholder: "3.0.0rc1 or a commit SHA"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I used the fixed default seed (`plastbench-v1`) and the unmodified dataset manifest.
          required: true
        - label: The run was not disturbed by other heavy jobs on the machine.
