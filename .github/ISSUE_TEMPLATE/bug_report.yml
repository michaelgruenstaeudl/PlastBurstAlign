name: Bug report
description: Something does not work, crashes, or gives a wrong result
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search the existing
        issues first. **Security problems must not be reported here**; see
        [SECURITY.md](https://github.com/michaelgruenstaeudl/PlastBurstAlign/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: "I ran ... and expected ... but got ..."
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or code that triggers the problem
      description: The exact command line (or `pba.align(...)` call) and, if used, the config file.
      render: shell
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `plastburstalign --doctor`
      description: >-
        Paste the complete output. It lists the version, the host (cores, memory,
        cgroup/Slurm limits, scratch tiers) and the aligners that were found.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log output / traceback
      description: Run again with `--verbose` and paste the relevant part (or attach the run manifest).
      render: text
  - type: input
    id: install
    attributes:
      label: How was PlastBurstAlign installed?
      placeholder: "pip install plastburstalign / conda env + pip install -e . / ..."
  - type: textarea
    id: data
    attributes:
      label: Input data
      description: >-
        How many genomes, which kind (GenBank accession numbers or a minimal
        record that reproduces the problem). Please do not paste large files.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues.
          required: true
        - label: I am using the latest release or `main`.
