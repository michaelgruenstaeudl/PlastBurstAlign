name: Feature request
description: Suggest an improvement or a new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Which problem would this solve?
      description: Describe your use case (dataset size, region type, downstream analysis, hardware).
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should the command-line flag, API or output look like?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Workarounds, other tools, or other designs.
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Extraction / GenBank parsing
        - Alignment / aligner selection
        - Concatenation / trimming / partitions
        - Scheduling / performance / memory
        - Slurm / HPC
        - Python API
        - Command line interface / dashboard
        - Documentation
        - Benchmarks (PlastBench)
        - Packaging / CI
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to open a pull request for this.
