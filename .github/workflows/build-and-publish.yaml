# Workflow derived from https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/
#
# Publishing is gated on the test workflow: the `tests` job below calls the
# reusable CI workflow (.github/workflows/ci.yml, `workflow_call`) for exactly
# the commit being published, and `build` -> `publish-to-pypi` ->
# `github-release` only run if every lint, test and packaging job passed.
#
# One-time setup (maintainers):
#   * PyPI: add a "trusted publisher" for this repository, workflow file
#     `build-and-publish.yaml`, environment `pypi`
#     (https://pypi.org/manage/project/plastburstalign/settings/publishing/).
#   * GitHub: create the `pypi` environment (optionally with required reviewers).
#   * Bump `version` in pyproject.toml and merge to main: that push triggers this
#     workflow (pre-releases such as 3.0.0rc1 are published as GitHub pre-releases).

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'pyproject.toml'

name: build-and-publish

permissions:
  contents: read

concurrency:
  group: build-and-publish-${{ github.ref }}
  cancel-in-progress: false


jobs:
  tests:
    name: Tests must pass before publishing
    if: github.repository == 'michaelgruenstaeudl/PlastBurstAlign'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build distribution 📦
    needs:
      - tests
    if: github.repository == 'michaelgruenstaeudl/PlastBurstAlign'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pypa/build and twine
        run: >-
          python3 -m
          pip install
          build
          twine
          --user

      - name: Build a binary wheel and a source tarball
        run: python3 -m build

      - name: Check the distribution metadata
        run: python3 -m twine check --strict dist/*

      - name: Store the distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/


  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/plastburstalign
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1


  github-release:
    name: >-
      Sign the Python 🐍 distribution 📦 with Sigstore
      and upload them to GitHub Release
    needs:
      - publish-to-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write  # IMPORTANT: mandatory for making GitHub Releases
      id-token: write  # IMPORTANT: mandatory for sigstore

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Sign the dists with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.3.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl

      - name: Extract package name and version
        run: |
          # Wheel file names are `<name>-<version>-<tags>.whl` and neither the
          # (normalized) name nor a PEP 440 version contains a hyphen. This also
          # works for pre-releases such as 3.0.0rc1.
          FILE=$(ls dist/*.whl | head -n 1)
          BASE=$(basename "$FILE")
          PACKAGE_NAME=$(echo "$BASE" | cut -d- -f1)
          PACKAGE_VERSION=$(echo "$BASE" | cut -d- -f2)
          # Set output variables for GitHub Actions
          echo "package_name=$PACKAGE_NAME" >> $GITHUB_ENV
          echo "package_version=$PACKAGE_VERSION" >> $GITHUB_ENV
          # a/b/rc/dev/post markers => mark the GitHub release as a pre-release
          if echo "$PACKAGE_VERSION" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
            echo "release_flags=" >> $GITHUB_ENV
          else
            echo "release_flags=--prerelease" >> $GITHUB_ENV
          fi

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release create
          '${{ env.package_name }}-${{ env.package_version }}'
          ${{ env.release_flags }}
          --repo '${{ github.repository }}'
          --notes ""

      - name: Upload artifact signatures to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Upload to GitHub Release using the `gh` CLI.
        # `dist/` contains the built packages, and the
        # sigstore-produced signatures and certificates.
        run: >-
          gh release upload
          '${{ env.package_name }}-${{ env.package_version }}' dist/**
          --repo '${{ github.repository }}'
