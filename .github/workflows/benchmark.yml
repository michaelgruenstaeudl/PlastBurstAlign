name: PlastBench

# Runs the PlastBench *smoke* tier (N=100 subset of the Asteraceae dataset,
# Zenodo record 17137737) on a GitHub-hosted runner, uploads the results JSON
# and, for main / releases, publishes shields.io endpoint badge JSON files to
# the `badges` branch. The larger tiers (1k / 5k / 15k) are far too big for a
# hosted runner and are run by maintainers on an HPC node; see
# benchmarking/plastbench/README.md.
#
# GitHub-hosted runners are shared and noisy: treat the badge numbers as a
# smoke-level indication, not as a publication-grade measurement.
#
# One-time setup (maintainers):
#   1. Nothing to create by hand: the first publishing run creates the orphan
#      branch `badges` (it only ever contains speedup.json, peak_memory.json and
#      the latest results). Do NOT protect that branch.
#   2. If the organisation restricts GITHUB_TOKEN to read-only, allow
#      "Read and write permissions" under Settings > Actions > General >
#      Workflow permissions (this workflow only requests `contents: write` in
#      the `publish-badges` job).
#   3. Add badges to the README, e.g.
#      ![speedup](https://img.shields.io/endpoint?url=https%3A%2F%2Fraw.githubusercontent.com%2Fmichaelgruenstaeudl%2FPlastBurstAlign%2Fbadges%2Fspeedup.json)
#      ![peak memory](https://img.shields.io/endpoint?url=https%3A%2F%2Fraw.githubusercontent.com%2Fmichaelgruenstaeudl%2FPlastBurstAlign%2Fbadges%2Fpeak_memory.json)
on:
  workflow_dispatch:
    inputs:
      tools:
        description: "Space-separated tools to run (pba mafft muscle clustalo shell)"
        type: string
        default: "pba mafft muscle clustalo shell"
      publish-badges:
        description: "Publish the badge JSON to the `badges` branch (only on main)"
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: plastbench-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PLASTBENCH_DATASET: benchmark_YangEtAl2022_Asteraceae
  PLASTBENCH_TIER: smoke

jobs:
  smoke:
    name: PlastBench smoke tier (N=100)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install MAFFT, MUSCLE, Clustal Omega and FastTree
        # FastTree lets PlastBench compute Robinson-Foulds distances between the
        # topologies obtained from the different pipelines.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mafft muscle clustalo fasttree

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install PlastBurstAlign
        run: python -m pip install -e .

      - name: Validate the dataset manifest
        run: python benchmarking/plastbench/plastbench.py list

      - name: Fetch the dataset (sha256-verified)
        run: >-
          python benchmarking/plastbench/plastbench.py fetch
          "${PLASTBENCH_DATASET}"
          --dest "${RUNNER_TEMP}/plastbench-data"

      - name: Subsample the smoke tier (deterministic, N=100)
        run: >-
          python benchmarking/plastbench/plastbench.py subsample
          --src "${RUNNER_TEMP}/plastbench-data/${PLASTBENCH_DATASET}"
          --tier "${PLASTBENCH_TIER}"
          --out "${RUNNER_TEMP}/plastbench-subset"

      - name: Run PlastBurstAlign and the baselines
        env:
          # The `tools` input only exists for manual runs; releases run everything.
          TOOLS: ${{ inputs.tools || 'pba mafft muscle clustalo shell' }}
        run: >-
          python benchmarking/plastbench/plastbench.py run
          --input "${RUNNER_TEMP}/plastbench-subset"
          --out results/plastbench-smoke.json
          --dataset-name "${PLASTBENCH_DATASET}"
          --tier "${PLASTBENCH_TIER}"
          --mode igs
          --threads auto
          --min-taxa 5
          --min-len 6
          --timeout 1500
          --reference-tree baseline
          --tools ${TOOLS}

      - name: Render the report and the badge files
        if: ${{ !cancelled() }}
        run: |
          python benchmarking/plastbench/plastbench.py report results/plastbench-smoke.json \
            --output results/plastbench-smoke.md
          python benchmarking/plastbench/plastbench.py badges results/plastbench-smoke.json \
            --out-dir results/badges
          {
            echo "## PlastBench smoke tier (N=100)"
            cat results/plastbench-smoke.md
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: plastbench-results
          path: results/
          retention-days: 90

  publish-badges:
    name: Publish badges to the `badges` branch
    needs: smoke
    # main (manual run with publish-badges=true) or a published release; never
    # for other branches, tags or pull requests.
    if: >-
      ${{ github.event_name == 'release'
      || (github.ref == 'refs/heads/main' && inputs.publish-badges) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # push to the `badges` branch
    concurrency:
      group: plastbench-badges
      cancel-in-progress: false
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Download the results
        uses: actions/download-artifact@v8
        with:
          name: plastbench-results
          path: ${{ runner.temp }}/plastbench-results

      - name: Switch to the badges branch (created on first use)
        run: |
          if git ls-remote --exit-code --heads origin badges > /dev/null 2>&1; then
            git fetch --depth=1 origin badges
            git checkout --quiet -B badges FETCH_HEAD
          else
            git checkout --quiet --orphan badges
            git rm -rf --quiet .
          fi

      - name: Commit the new badge files
        env:
          RESULTS: ${{ runner.temp }}/plastbench-results
        run: |
          cp "${RESULTS}/badges/speedup.json" "${RESULTS}/badges/peak_memory.json" .
          cp "${RESULTS}/plastbench-smoke.json" "${RESULTS}/plastbench-smoke.md" .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add speedup.json peak_memory.json plastbench-smoke.json plastbench-smoke.md
          if git diff --cached --quiet; then
            echo "badges unchanged"
          else
            git commit --quiet -m "chore(badges): PlastBench smoke results for ${GITHUB_SHA::7}"
            git push origin HEAD:badges
          fi
