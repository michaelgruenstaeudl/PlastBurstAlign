# Install once with `pre-commit install`; run everywhere with `pre-commit run -a`.
# The ruff and mypy revisions match the pinned minor series of the `dev` extra in
# pyproject.toml and the `plastburst-dev` environment, so hooks, `ruff format
# --check .` and `mypy plastburstalign` in CI give the same answer. Bump them
# together.
exclude: '^benchmarking/legacyversions/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        # Gate the whole package exactly like CI (`mypy plastburstalign`), not
        # just the files touched by a commit.
        files: ^plastburstalign/
        pass_filenames: false
        args: [--config-file=pyproject.toml, plastburstalign]
        additional_dependencies:
          - types-PyYAML
          - biopython>=1.85
          - numpy>=1.26
          - rich>=13
          - coloredlogs
          - psutil
          - pyyaml
