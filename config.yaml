# Sample configuration file for PlastBurstAlign
# This file allows you to specify parameters for the tool

# Input/Output directories
in_dir: "./benchmarking/Asteraceae_dataset"
out_dir: "./benchmarking/Asteraceae_out"

# Selection mode: cds, int, igs, or rna (tRNAs and rRNAs; nucleotide-only alignment)
select_mode: "igs"

# RNA mode only: independently enable tRNAs and rRNAs
include_trna: true
include_rrna: true

# File extension for input files
fileext: ".gb"

# Genes to exclude
exclude_fullcds:
  - "rps12"

# Minimum sequence length
min_seq_length: 9

# Minimum number of taxa
min_num_taxa: 2

# Number of threads (or 'auto')
num_threads: "auto"

# Enable verbose logging
verbose: false

# Output order: 'seq' or 'alpha'
order: "seq"

# Enable concatenation
concat: false

#------------------------------------------------------------------------------------------------------------------------------

# Path to alignment tool executable (optional)

# For mafft:
# alignment_tool: "mafft"
# # alignment_tool_path: "/path/to/mafft"
#   # MAFFT options
#   threads: 4 # Number of threads (or "auto")
#   algorithm: "auto"  # Options: auto, localpair, globalpair, genafpair, retree, maxiterate
#   adjustdirection: true
#   quiet: false
#   retree: 1
#   maxiterate: 0

#------------------------------------------------------------------------------------------------------------------------------


# For Clustal Omega:
# alignment_tool: "clustal"
# # alignment_tool_path: "/path/to/clustalo"
# alignment_tool_config:
#   iterations: 0  # HMM iterations (0 = default)
#   threads: 4 # Number of threads
#   outfmt: "fasta"  # Output format: fasta, clustal, msf, phylip, selex, vienna
#   verbose: false,
#   dealign: false

#------------------------------------------------------------------------------------------------------------------------------

# For MUSCLE:
# alignment_tool: "muscle"
# alignment_tool_path: "/usr/bin/muscle"
# alignment_tool_config:
#   perm: "none"           # Guide tree permutation: none, abc, acb, bca (default: none)
#   perturb: 0             # Perturbation seed: 0, 1, 2... (default: 0)


#------------------------------------------------------------------------------------------------------------------------------

# For a generic command-line aligner template, you can specify the tool and its command-line arguments as follows:
# alignment_tool: "generic"
# alignment_tool_path: "/path/to/your-aligner"
# alignment_tool_config:
#   input_flag: "-i"          # or the input switch your aligner uses
#   output_flag: "-o"         # or the output switch your aligner uses
#   threads_flag: "-t"        # or the thread switch your aligner uses
#   extra_args:
#     some-option: value

